version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ms-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appuser -d appdb']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    container_name: ms-api
    environment:
      DATABASE_URL: postgresql://appuser:${POSTGRES_PASSWORD}@db:5432/appdb
      JWT_SECRET: ${JWT_SECRET}
      DEMO_USERNAME: ${DEMO_USERNAME}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build: ./agent
    container_name: ms-agent
    environment:
      API_URL: http://api:8000
      API_USERNAME: ${DEMO_USERNAME}
      API_PASSWORD: ${DEMO_PASSWORD}
    ports:
      - '8501:8501'
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ms-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ms-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  db_data:
  prometheus_data:
  grafana_data:
